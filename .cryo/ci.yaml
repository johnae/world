# world CI, run on cryosleep. The router (.cryo/router.sh) fetches this
# file at the pushed commit and spawns it, so a push builds the pipeline
# it shipped with.
#
# Three jobs mirroring the GitHub Actions workflow: lint, check, and the
# whole x86_64-linux package set. Each job is claimed independently and
# may land on a different builder, so each clones its own workdir -
# never rely on another job's checkout being on the same machine.
#
# Avoid `${{ }}` inside step scripts: it is the pipeline's interpolation
# sigil, and a ref or commit message spliced into shell text lands
# unescaped. Values reach the scripts as env vars instead, rendered once
# in the top-level `env:` below and read as plain `$VAR`.
name: world-ci
tags: [world]

# One build per ref, newest wins: pushing again cancels the run for the
# previous commit rather than queueing behind the two builders it lost.
concurrency:
  group: "world-ci-${{ input == null ? 'manual' : (has(input.ref) ? input.ref : 'manual') }}"
  policy: cancel-running

env:
  # The router passes the pushed commit as `input.sha`. A manual
  # `cryo submit` carries no input, and the clone stays on the default
  # branch - so this must tolerate a missing field rather than error.
  SHA: "${{ input == null ? '' : (has(input.sha) ? input.sha : '') }}"
  # `refs/heads/main` for a main push; a PR passes its head branch, which
  # is how the publish step below tells the two apart.
  REF: "${{ input == null ? '' : (has(input.ref) ? input.ref : '') }}"
  REPO: https://github.com/johnae/world
  # Jobs run in a scrubbed environment and the agent's nix is not on the
  # default PATH.
  PATH: "/nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  NIX_CONFIG: |
    accept-flake-config = true
    extra-substituters = https://insane.cachix.org
    extra-trusted-public-keys = insane.cachix.org-1:cLCCoYQKkmEb/M88UIssfg2FiSDUL4PUjYj9tdo4P8o=

jobs:
  lint:
    requires: [build]
    timeout: 20m
    # A corrupted NAR from a substituter killed a full build once;
    # nix keeps whatever it already fetched, so a retry is cheap.
    retry:
      attempts: 2
      backoff: 30s
    env:
      WORKDIR: /tmp/world-lint
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          git clone --depth 1 --quiet "$REPO" "$WORKDIR"
          if [ -n "$SHA" ]; then
            git -C "$WORKDIR" fetch --depth 1 --quiet origin "$SHA"
            git -C "$WORKDIR" checkout --quiet "$SHA"
          fi
          git -C "$WORKDIR" --no-pager log -1 --format='building %H %s'
      - name: lint
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          nix run .#world -- lint

  check:
    requires: [build]
    timeout: 60m
    # A corrupted NAR from a substituter killed a full build once;
    # nix keeps whatever it already fetched, so a retry is cheap.
    retry:
      attempts: 2
      backoff: 30s
    env:
      WORKDIR: /tmp/world-check
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          git clone --depth 1 --quiet "$REPO" "$WORKDIR"
          if [ -n "$SHA" ]; then
            git -C "$WORKDIR" fetch --depth 1 --quiet origin "$SHA"
            git -C "$WORKDIR" checkout --quiet "$SHA"
          fi
          git -C "$WORKDIR" --no-pager log -1 --format='building %H %s'
      - name: check
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          nix run .#world -- check

  packages:
    requires: [build]
    timeout: 180m
    # A corrupted NAR from a substituter killed a full build once;
    # nix keeps whatever it already fetched, so a retry is cheap.
    retry:
      attempts: 2
      backoff: 30s
    env:
      WORKDIR: /tmp/world-pkgs
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          git clone --depth 1 --quiet "$REPO" "$WORKDIR"
          if [ -n "$SHA" ]; then
            git -C "$WORKDIR" fetch --depth 1 --quiet origin "$SHA"
            git -C "$WORKDIR" checkout --quiet "$SHA"
          fi
          git -C "$WORKDIR" --no-pager log -1 --format='building %H %s'
      - name: build
        run: |
          set -euo pipefail
          cd "$WORKDIR"

          # The package set comes from evaluating the flake, so the list
          # is not known until this runs.
          mapfile -t pkgs < <(nix eval .#github-actions-package-matrix-x86-64-linux --json | jq -r '.pkg[]')
          echo "building ${#pkgs[@]} packages"
          # Everything is built; only the non-image set is cached. Sorting
          # by name rather than by output size is deliberate: with
          # streamLayeredImage the containerdisk output is a small script
          # whose CLOSURE holds the ~10G qcow2, so a size check on the
          # output would wave it straight through and push the image
          # anyway.
          attrs=(); cache_attrs=()
          for p in "${pkgs[@]}"; do
            attrs+=(".#packages.x86_64-linux.$p")
            case "$p" in
              *-qcow2|*-containerdisk|*-diskformat)
                echo "not caching $p (image artifact)" >&2 ;;
              *)
                cache_attrs+=(".#packages.x86_64-linux.$p") ;;
            esac
          done

          # One invocation, so nix schedules the whole set across cores
          # itself instead of one package at a time. --print-build-logs
          # stays: without it a 50-minute build emits a few hundred bytes
          # and is indistinguishable from a hang. Build logs go to stderr,
          # so stdout is just the output paths.
          #
          # raw-with-logs drops the progress bar and keeps the build
          # logs. The bar redraws constantly under a PTY and was most of
          # what the run page had to parse; without it the same two
          # opening steps went from 7.8 MB of buffer to 16 KB.
          #
          # It must be raw-WITH-LOGS. Plain `raw` swallows build output
          # even with --print-build-logs, which turns a long build silent
          # and indistinguishable from a hang - measured, not assumed.
          nix build --no-link --log-format raw-with-logs \
            --print-build-logs --print-out-paths "${attrs[@]}" \
            > /tmp/world-outs
          echo "built $(wc -l < /tmp/world-outs) output paths"

          # Push what the commit produces, named explicitly. Two reasons
          # this is not a store-watching push:
          #
          # The builders keep a persistent nix store, so a warm one
          # builds nothing - and a push covering only newly-added paths
          # would publish nothing, leaving the cache empty precisely
          # because the builder was well warmed.
          #
          # These agents are shared with other projects' pipelines, which
          # add their own toolchain paths to the same store. Watching the
          # store would upload whatever a concurrent job happened to
          # fetch; naming the outputs means only world's packages and
          # their dependencies go to world's cache.
          #
          # cachix queries the cache first and skips paths already there,
          # so re-pushing a known closure is cheap.
          #
          # The image artifacts are left out (see the case above). On the
          # first fill they were 36 GiB of a 46 GiB upload and they change
          # on every input bump, so a nightly flake update would re-upload
          # all of it. They are still BUILT, so CI still proves they
          # build; the registry, not the cache, is where a built one is
          # kept.
          if [ -n "${CACHIX_SIGNING_KEY:-}" ]; then
            nix path-info "${cache_attrs[@]}" > /tmp/world-push
            echo "caching $(wc -l < /tmp/world-push) of ${#pkgs[@]} packages"
            xargs -r nix run nixpkgs#cachix -- push insane < /tmp/world-push
          else
            echo "CACHIX_SIGNING_KEY unset; not pushing to the cache" >&2
          fi

      - name: publish-containerdisk
        run: |
          set -euo pipefail
          # main publishes; a PR proves the image builds without shipping
          # it. The image is deliberately kept out of the nix cache (too
          # big), so the registry is the only place a built one survives.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "ref=${REF:-<none>}; not publishing" >&2
            exit 0
          fi
          cd "$WORKDIR"
          # streamLayeredImage yields a script, not an archive: running it
          # writes the docker-archive to stdout.
          stream="$(nix build --no-link --print-out-paths .#packages.x86_64-linux.vega-containerdisk)"

          # Tag by the store hash so it moves only when the image does.
          # A node caches a containerDisk by tag, so a mutable tag like
          # `latest` gives it no reason to pull a rebuilt image.
          tag="$(basename "$stream" | cut -d- -f1)"
          dest="registry.9000.dev/vega-containerdisk"
          echo "publishing $stream"
          echo "  as $dest:$tag"

          # nixpkgs skopeo ships no default trust policy, and the builders
          # no longer carry apt's podman that used to leave one behind.
          install -d -m755 /etc/containers
          printf '{"default":[{"type":"insecureAcceptAnything"}]}\n' > /etc/containers/policy.json

          nix shell nixpkgs#skopeo -c sh -c '
            set -eu
            if skopeo inspect --creds "${REGISTRY_USER:?}:${REGISTRY_PASS:?}" \
                 "docker://'"$dest:$tag"'" >/dev/null 2>&1; then
              echo "  already published; nothing to do"
              exit 0
            fi
            # skopeo has to seek within the archive, so the stream is
            # materialised once here rather than three times in the store.
            # /tmp is the same filesystem, so this costs one ~10G write.
            trap "rm -f /tmp/vega-cd.tar" EXIT
            '"$stream"' > /tmp/vega-cd.tar
            skopeo copy --dest-creds "${REGISTRY_USER:?}:${REGISTRY_PASS:?}" \
              docker-archive:/tmp/vega-cd.tar "docker://'"$dest:$tag"'"
            echo "  pushed"
          '
          echo "deploy with: $dest:$tag"
